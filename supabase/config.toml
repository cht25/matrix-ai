# =============================================================================
# MATRIX AI — Supabase project configuration
# Generate: supabase init
# =============================================================================
project_id = "matrix-ai"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
enable_signup = true
enable_confirmations = true

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = true

[auth.external.google]
enabled = false

[auth.external.facebook]
enabled = false

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

[analytics]
enabled = false

[functions.ai-gateway]
verify_jwt = false
[functions.export-data]
verify_jwt = false
[functions.delete-account]
verify_jwt = false
[functions.auth-events]
verify_jwt = false
