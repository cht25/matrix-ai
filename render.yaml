# Render blueprint for MATRIX AI (Next.js web service, Firebase backend).
# If you already created the service manually you can ignore this file — just
# make sure the same env vars below are set in Dashboard → your service →
# Environment. See "Deploy" in README.md (Firebase App Hosting is the
# first-class option; Render works identically with these variables).
services:
  - type: web
    name: matrix-ai
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Required — the app renders honest "not configured" screens without
      # them. Values from Firebase console → Project settings.
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        sync: false
      # Canonical app URL (links / emails only — middleware never redirects
      # here). Must be a hostname that is actually attached to THIS service
      # (the Cloudflare subdomain, or *.onrender.com). Do not set the apex
      # (https://thamjj13.top) unless that host is also added under
      # Render → Custom Domains, or visitors will see a plain-text Not Found.
      - key: NEXT_PUBLIC_APP_URL
        value: https://matrix.thamjj13.top
      # Server-only Admin SDK + AI gateway secrets.
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GLM_API_KEY
        sync: false
      # Z.ai international keys use ZAI_API_KEY (defaults to api.z.ai).
      # Existing GLM_API_KEY uses the mainland endpoint unless GLM_BASE_URL is set.
      - key: ZAI_API_KEY
        sync: false
      - key: GLM_BASE_URL
        sync: false
      - key: GLM_IMAGE_BASE_URL
        sync: false
      - key: GLM_IMAGE_API_KEY
        sync: false
      - key: GLM_MODEL
        value: glm-4.7
      - key: GLM_CODING_MODEL
        value: glm-4.7
      - key: GLM_VISION_MODEL
        value: glm-4.6v
      - key: GLM_IMAGE_MODEL
        value: cogview-4
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_CHAT_MODEL
        value: openai/gpt-oss-120b
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_TOKEN_ENCRYPTION_KEY
        sync: false
      # Public, non-secret URL; must exactly match the callback registered on
      # the GitHub OAuth App and NEXT_PUBLIC_APP_URL + /api/github/callback.
      - key: GITHUB_OAUTH_CALLBACK_URL
        value: https://matrix.thamjj13.top/api/github/callback
