# Render blueprint for MATRIX AI (Next.js web service).
# If you already created the service manually you can ignore this file — just
# make sure the same env vars below are set in Dashboard → your service →
# Environment. See "Deploy to Render" in README.md.
services:
  - type: web
    name: matrix-ai
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      # Required for real data — the app falls back to demo mode without them.
      # Fill values from https://supabase.com/dashboard/project/_/settings/api
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      # Canonical app URL (used for links/redirects). Set to your Render URL.
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      # Keep false in production. The app still degrades to demo mode
      # automatically if the Supabase credentials above are missing.
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "false"
