[package]
name = "matrix-ai-desktop"
version = "1.0.0"
description = "MATRIX AI Desktop & Companion App — Native OS Notifications, Family Supervision & Device Telemetry"
authors = ["THAMJJ13.TOP White Hat Team"]
license = "Proprietary"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "matrix_ai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
chrono = { version = "0.4", features = ["serde"] }
