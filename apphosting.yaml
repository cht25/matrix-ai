# Firebase App Hosting backend config (the managed Next.js deployment path).
# Requires the Blaze plan. Alternative: `firebase deploy` uses the hosting +
# frameworksBackend config in firebase.json; the app also runs anywhere Node
# runs (Render/Vercel/Docker) with the same environment variables.
runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512
env:
  # Client config (public by design)
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_APP_URL
    availability: [BUILD, RUNTIME]
  # Server-only (secrets) — App Hosting resolves these from Secret Manager when
  # you pass --secretpath, or set them via the console.
  - variable: FIREBASE_CLIENT_EMAIL
    availability: [RUNTIME]
    secret: FIREBASE_CLIENT_EMAIL
  - variable: FIREBASE_PRIVATE_KEY
    availability: [RUNTIME]
    secret: FIREBASE_PRIVATE_KEY
  - variable: FIREBASE_STORAGE_BUCKET
    availability: [RUNTIME]
  - variable: GROQ_API_KEY
    availability: [RUNTIME]
    secret: GROQ_API_KEY
