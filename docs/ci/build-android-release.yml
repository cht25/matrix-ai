# =============================================================================
# MATRIX — Android release pipeline.
#
# Builds the official companion APK on GitHub-hosted runners and attaches it
# to a GitHub Release. Trigger: push a tag like `v1.0.0`, or run manually.
#
# Required repository secrets (Settings → Secrets → Actions):
#   MATRIX_API_BASE          e.g. https://matrix.thamjj13.top
#   FIREBASE_OPTIONS_DART    base64 of the flutterfire-generated
#                            lib/firebase_options.dart (public web config only)
#   GOOGLE_SERVICES_JSON     base64 of android/app/google-services.json
#   KEYSTORE_BASE64          base64 of the release upload keystore (.jks)
#   KEYSTORE_PASSWORD        keystore password
#   KEY_ALIAS                key alias
#   KEY_PASSWORD             key password
# =============================================================================
name: Build Android release APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create GitHub Releases

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/matrix_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.0"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode Firebase + signing material
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$FIREBASE_OPTIONS_DART" | base64 -d > lib/firebase_options.dart
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (fail the build on errors)
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        env:
          MATRIX_API_BASE: ${{ secrets.MATRIX_API_BASE }}
        run: flutter build apk --release --dart-define=MATRIX_API_BASE="$MATRIX_API_BASE"

      - name: Build release bundle (Play Store)
        env:
          MATRIX_API_BASE: ${{ secrets.MATRIX_API_BASE }}
        run: flutter build appbundle --release --dart-define=MATRIX_API_BASE="$MATRIX_API_BASE"

      - name: Publish GitHub Release with artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MATRIX_API_BASE: ${{ secrets.MATRIX_API_BASE }}
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAB=build/app/outputs/bundle/release/app-release.aab
          TAG="${GITHUB_REF_NAME:-v$(date +%Y.%m.%d)}"
          NOTES="MATRIX Connect Android companion.\n\nAPI: $MATRIX_API_BASE\n\nInstall: enable 'Install unknown apps' for your browser/file manager, then install the APK."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$AAB" --clobber
          else
            gh release create "$TAG" "$APK" "$AAB" --title "MATRIX Android $TAG" --notes "$NOTES"
          fi
