# Ready-to-enable GitHub Actions workflow that builds a signed Android release
# APK (`matrix-android.apk` + `app-release.apk`) and Play Store AAB (`app-release.aab`),
# generates a SHA-256 checksum for `/api/app/version`, and attaches them to GitHub Releases.
#
# Copy into `.github/workflows/build-android-release.yml` via the GitHub web UI
# or a token that carries the `workflow` OAuth scope.
#
# Required repository secrets:
#   FIREBASE_API_KEY
#   FIREBASE_APP_ID
#   FIREBASE_MESSAGING_SENDER_ID
#   FIREBASE_PROJECT_ID
#   ANDROID_KEYSTORE_BASE64   (base64 -w0 release.keystore)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Optional repository variable:
#   MATRIX_API_BASE  (defaults to https://matrix.thamjj13.top)

name: Build MATRIX Android Phone Release

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "Semantic version (e.g. 1.1.0)"
        required: false
        default: "1.1.0"
      build_number:
        description: "Android integer build / versionCode (e.g. 2)"
        required: false
        default: "2"
  push:
    tags:
      - 'mobile-v*'

jobs:
  android-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/matrix_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable
          cache: true

      - name: Decode release keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/keystore
          echo "$KEYSTORE_B64" | base64 -d > android/keystore/release.keystore

      - name: Fetch dependencies, analyze & run unit tests
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build release APK & AAB (pointed at https://matrix.thamjj13.top)
        env:
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && '../keystore/release.keystore' || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VER: ${{ inputs.app_version || '1.1.0' }}
          APP_BUILD: ${{ inputs.build_number || '2' }}
        run: |
          DART_DEFINES=(
            --build-name="$APP_VER"
            --build-number="$APP_BUILD"
            --dart-define=MATRIX_API_BASE=${{ vars.MATRIX_API_BASE || 'https://matrix.thamjj13.top' }}
            --dart-define=MATRIX_APP_VERSION="$APP_VER"
            --dart-define=MATRIX_APP_BUILD="$APP_BUILD"
            --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
            --dart-define=FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
            --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
            --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          )
          flutter build apk --release "${DART_DEFINES[@]}"
          flutter build appbundle --release "${DART_DEFINES[@]}"
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/matrix-android.apk
          sha256sum build/app/outputs/flutter-apk/matrix-android.apk > build/app/outputs/flutter-apk/matrix-android.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: matrix-android-release
          path: |
            mobile/matrix_app/build/app/outputs/flutter-apk/matrix-android.apk
            mobile/matrix_app/build/app/outputs/flutter-apk/matrix-android.apk.sha256
            mobile/matrix_app/build/app/outputs/flutter-apk/app-release.apk
            mobile/matrix_app/build/app/outputs/bundle/release/app-release.aab

      - name: Attach APK to GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mobile/matrix_app/build/app/outputs/flutter-apk/matrix-android.apk
            mobile/matrix_app/build/app/outputs/flutter-apk/matrix-android.apk.sha256
            mobile/matrix_app/build/app/outputs/bundle/release/app-release.aab
